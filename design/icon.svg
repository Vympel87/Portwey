<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sky blue at the top, fading into deep sea blue at the bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0C4A6E"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Keeps the white mark readable on the light sky -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0C4A6E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon body (macOS icon grid: 824×824 with a 100px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g fill="#FFFFFF" filter="url(#markShadow)">
    <!-- Quay -->
    <rect x="220" y="660" width="584" height="70" rx="22"/>

    <!-- Stacked containers -->
    <rect x="250" y="578" width="70" height="70" rx="12"/>
    <rect x="332" y="578" width="70" height="70" rx="12"/>
    <rect x="414" y="578" width="70" height="70" rx="12"/>
    <rect x="291" y="496" width="70" height="70" rx="12"/>
    <rect x="373" y="496" width="70" height="70" rx="12"/>

    <!-- Crane mast and cabin -->
    <rect x="620" y="300" width="46" height="370" rx="16"/>
    <rect x="606" y="384" width="74" height="54" rx="12"/>

    <!-- Crane boom with its counterweight -->
    <rect x="470" y="296" width="300" height="42" rx="21"/>
    <rect x="726" y="338" width="56" height="54" rx="12"/>

    <!-- Cable and the container being lifted -->
    <rect x="516" y="338" width="10" height="88" rx="5"/>
    <rect x="486" y="426" width="70" height="70" rx="12"/>
  </g>
</svg>