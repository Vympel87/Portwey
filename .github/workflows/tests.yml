name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher-core:
    name: LauncherCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --package-path LauncherCore